[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radariq"
version = "0.1.0"
description = "RadarIQops dataset inspection CLI"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9",
  "numpy>=1.26",
]

[project.scripts]
radariq = "radariq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

