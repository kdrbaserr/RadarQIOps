[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radariq"
version = "0.1.0"
description = "RadarIQops dataset inspection CLI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "h5py>=3.11,<4",
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
radariq = "radariq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]

