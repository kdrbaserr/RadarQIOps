[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radariq"
version = "0.1.0"
description = "RadarIQops dataset inspection CLI"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8"]

[project.scripts]
radariq = "radariq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

