name: PR Fast Quality

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-fast-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: pr-fast-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.14"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --all-extras

      - name: Lint and import order
        run: uv run --no-sync poe lint

      - name: Check Python format
        run: uv run --no-sync poe format-check

      - name: Check Markdown and YAML
        run: |
          uv run --no-sync poe markdown-check
          uv run --no-sync poe yaml-check

      - name: Typecheck
        run: uv run --no-sync poe typecheck

      - name: Run all local tests
        run: uv run --no-sync poe test-all-local

      - name: Run API smoke test
        run: uv run --no-sync poe api-smoke

  colab-evidence:
    name: pr-colab-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.14"
          python-version: "3.11.15"
          enable-cache: false

      - name: Validate Colab evidence gate
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python tools/check_colab_evidence.py
