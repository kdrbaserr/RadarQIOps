services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: radariq-api:local
    environment:
      RADARIQ_MODEL_PATH: /models/model.npz
    ports:
      - "8000:8000"
    volumes:
      - ../artifacts:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
